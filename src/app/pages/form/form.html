<div class="flex justify-center items-center min-h-screen bg-gray-50 p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-md border border-gray-100 p-6">

    <div class="mb-6">
      <h2 class="text-xl font-bold text-gray-900">Añadir Nuevo Producto</h2>
      <p class="text-sm text-gray-500 mt-1">Ingresa los detalles para registrar el artículo en el inventario.</p>
    </div>

    <form class="space-y-5">

      <div>
        <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-1.5">
          Nombre del producto
        </label>
        <input
          type="text"
          id="nombre"
          placeholder="Ej. Cámara Réflex Digital"
          class="w-full px-3.5 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors"
        />
      </div>

      <div>
        <label for="stock" class="block text-sm font-semibold text-gray-700 mb-1.5">
          Stock disponible
        </label>
        <input
          type="number"
          id="stock"
          placeholder="0" min="0"
          class="w-full px-3.5 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors"
        />
      </div>

      <div>
        <label for="descripcion" class="block text-sm font-semibold text-gray-700 mb-1.5">
          Descripción
        </label>
        <textarea
          id="descripcion"
          rows="4"
          placeholder="Describe las características principales del producto..."
          class="w-full px-3.5 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors resize-none"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-3 pt-2">
        <button
          type="button"
          class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 border border-transparent rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-sm transition-colors"
        >
          Guardar Producto
        </button>
      </div>

    </form>
  </div>
</div>
