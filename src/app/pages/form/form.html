<div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="relative w-full max-w-2xl bg-[#151922]/95 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <button
      type="button"
      (click)="close()"
      class="absolute right-4 top-4 rounded-full bg-slate-900/80 p-3 text-gray-300 hover:bg-slate-800 transition"
      aria-label="Cerrar modal"
    >
      ✕
    </button>

    <div class="mb-8">
      <h3 class="text-2xl font-bold bg-linear-to-r from-white to-slate-400 bg-clip-text text-transparent">
        Agregar producto
      </h3>
      <p class="text-gray-500 text-sm mt-1">
        Completa la información para registrar un nuevo producto en inventario.
      </p>
    </div>

    <form class="space-y-6">
      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-400 mb-2">
          Nombre del producto
        </label>
        <input
          type="text"
          id="nombre"
          placeholder="Ej. Papas Sabritas Adobadas 170g"
          class="w-full bg-[#0f1117] border border-slate-800 rounded-2xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-400 transition-all duration-300"
        />
      </div>

      <div class="grid gap-6 md:grid-cols-2">
        <div>
          <label for="stock" class="block text-sm font-medium text-gray-400 mb-2">
            Stock inicial
          </label>
          <input
            type="number"
            id="stock"
            placeholder="0"
            min="0"
            class="w-full bg-[#0f1117] border border-slate-800 rounded-2xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-purple-400 transition-all duration-300"
          />
        </div>
        <div>
          <label for="precio" class="block text-sm font-medium text-gray-400 mb-2">
            Precio
          </label>
          <input
            type="text"
            id="precio"
            placeholder="$0.00"
            class="w-full bg-[#0f1117] border border-slate-800 rounded-2xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-emerald-400 transition-all duration-300"
          />
        </div>
      </div>

      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-400 mb-2">
          Descripción corta
        </label>
        <textarea
          id="descripcion"
          rows="4"
          placeholder="Escribe detalles del producto, ingredientes o especificaciones..."
          class="w-full bg-[#0f1117] border border-slate-800 rounded-2xl px-4 py-3 text-gray-100 placeholder-gray-500 focus:outline-none focus:border-indigo-400 transition-all duration-300 resize-none"
        ></textarea>
      </div>

      <div class="flex flex-col gap-3 sm:flex-row sm:justify-end sm:items-center pt-4 border-t border-slate-800/60">
        <button
          type="button"
          (click)="close()"
          class="rounded-2xl px-5 py-3 text-sm font-medium text-gray-300 bg-slate-900/80 hover:bg-slate-800 transition"
        >
          Cancelar
        </button>
        <button
          type="submit"
          class="rounded-2xl px-6 py-3 text-sm font-semibold bg-linear-to-r from-indigo-600 to-cyan-500 text-white hover:scale-105 transition-all duration-300"
        >
          Guardar producto
        </button>
      </div>
    </form>
  </div>
</div>
