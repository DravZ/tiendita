<div class="flex justify-center items-center min-h-screen bg-[#0f1117] p-6">

  <div class="w-full max-w-2xl bg-[#151922]/90 backdrop-blur-md border border-slate-800 rounded-3xl p-8 hover:shadow-[0_0_30px_rgba(59,130,246,0.1)] transition-all duration-500">

    <div class="mb-8">
      <h3 class="text-2xl font-bold bg-linear-to-r from-white to-slate-400 bg-clip-text text-transparent">
        Añadir Nuevo Producto
      </h3>
      <p class="text-gray-500 text-sm mt-1">
        Registra las propiedades esenciales para actualizar el inventario.
      </p>
    </div>

    <form class="space-y-6">

      <div>
        <label for="nombre" class="block text-sm font-medium text-gray-400 mb-2">
          Nombre del producto
        </label>
        <input
          type="text"
          id="nombre"
          placeholder="Ej. Papas Sabritas Adobadas 170g"
          class="w-full bg-[#1a1d27] border border-slate-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_20px_rgba(34,211,238,0.2)] transition-all duration-300"
        />
      </div>

      <div>
        <label for="stock" class="block text-sm font-medium text-gray-400 mb-2">
          Stock Inicial
        </label>
        <input
          type="number"
          id="stock"
          placeholder="0"
          min="0"
          class="w-full bg-[#1a1d27] border border-slate-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-purple-400 focus:shadow-[0_0_20px_rgba(147,51,234,0.2)] transition-all duration-300"
        />
      </div>

      <div>
        <label for="descripcion" class="block text-sm font-medium text-gray-400 mb-2">
          Descripción corta
        </label>
        <textarea
          id="descripcion"
          rows="4"
          placeholder="Escribe detalles del producto, ingredientes o especificaciones..."
          class="w-full bg-[#1a1d27] border border-slate-700 rounded-xl px-4 py-3 text-gray-100 placeholder-gray-600 focus:outline-none focus:border-indigo-400 focus:shadow-[0_0_20px_rgba(99,102,241,0.2)] transition-all duration-300 resize-none"
        ></textarea>
      </div>

      <div class="flex items-center justify-end gap-4 pt-4 border-t border-slate-800/60">

        <button
          type="button"
          class="px-5 py-3 rounded-xl text-gray-400 hover:bg-slate-800 hover:text-white transition-all duration-300 cursor-pointer text-sm font-medium"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="px-6 py-3 rounded-xl bg-linear-to-r from-indigo-600 to-cyan-500 font-medium text-white hover:scale-105 hover:shadow-[0_0_20px_rgba(59,130,246,0.4)] transition-all duration-300 cursor-pointer text-sm"
        >
          Guardar Producto
        </button>

      </div>

    </form>
  </div>
</div>
